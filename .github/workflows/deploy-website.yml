name: Deploy Website

# Ships website/ to the Fly app `codrift` (see website/fly.toml). Path-filtered
# so app-only merges don't redeploy the site, and vice versa.
#
# Deploys are serialised rather than cancelled: killing flyctl mid-release
# leaves the app on a half-rolled machine set.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://codrift.app

    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
