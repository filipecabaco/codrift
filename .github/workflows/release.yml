name: Release

# One workflow, four jobs: version -> bundle -> release -> cask.
#
# `bundle` only builds and uploads artifacts; `release` publishes them in a
# single step once every leg has succeeded. That split is deliberate: if each
# leg published on its own, one failing runner would leave a tag and a
# half-populated release behind, and the re-run would then trip the
# already-exists guard. Either everything ships or nothing does.
#
# `version` picks the number. On a push to `main` it derives the next semver
# from the Conventional Commit prefixes since the last `v*` tag (`fix:` patch,
# `feat:` minor, `type!:` / `major:` / `BREAKING CHANGE` major); no matching
# commit means no release. On a manual dispatch you may type a version to
# override that.
#
# The number is the single source of truth: it is stamped into mix.exs and
# tauri.conf.json before the build, names every published asset, and becomes the
# git tag, the GitHub Release and the Homebrew cask version. The versions
# committed in the repo are only placeholders — tags decide what ships.
#
# Why this isn't a tag-listening workflow: a tag pushed with the built-in
# GITHUB_TOKEN does not trigger workflows, so "push a tag and let CI notice"
# would silently never build. The release action creates the tag itself, last.
#
# Every job pins `github.sha`, and the release is tagged at that same SHA. Main
# moves while the bundles build — the previous run's cask bump alone moves it —
# and a tag placed on whatever HEAD happened to be would both describe code that
# was never built and make the next run's `$LAST..HEAD` range skip the commits
# it jumped over.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without a leading v (e.g. 1.2.3). Leave empty to derive it from the commits."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Exact patch (and version-type: strict): Burrito can only fetch an ERTS the
  # BEAM Machine CDN has built. Keep in sync with ci.yml.
  OTP_VERSION: "27.3.4.14"
  ELIXIR_VERSION: "1.18.4"

jobs:
  # ── 1. Version ───────────────────────────────────────────────────────────────
  version:
    name: Resolve version
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # fetch-depth: 0 brings the full history *and* the tags the bump reads.
      # The SHA is pinned so `$LAST..HEAD` is measured against the same commit
      # that gets bundled and tagged.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: resolve
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LAST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1)"

          # Published releases, not tags, are the source of truth for "what is
          # already out there": Codrift.Updater polls /releases/latest and the
          # cask URLs resolve against release assets. A tag can be absent from
          # the checkout while its release is live — deleted, or never pushed —
          # and deriving the base from tags alone then re-cuts a version that is
          # already published. Every installed build at that version then sees
          # `latest == current` and stays up to date forever, which is how a
          # release can be built from fresh code and still reach nobody.
          #
          # Errors are NOT swallowed. If the API call fails, falling back to a
          # tags-only baseline is precisely the bug above, so the job must die
          # rather than quietly derive a version that is already published.
          PUBLISHED="${RUNNER_TEMP:-/tmp}/published-tags"
          gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName --jq '.[].tagName' > "$PUBLISHED"

          LAST_RELEASE="$(
            { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' "$PUBLISHED" || true; } \
              | sort -V | tail -n1
          )"

          LAST="$(
            printf '%s\n%s\n' "$LAST_TAG" "$LAST_RELEASE" \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V | tail -n1
          )"
          BASE="${LAST#v}"
          BASE="${BASE:-0.0.0}"
          echo "Last tag: ${LAST_TAG:-<none>}  last release: ${LAST_RELEASE:-<none>}  base: ${BASE}"

          if [ -n "$REQUESTED" ]; then
            NEXT="$REQUESTED"
            echo "Manual dispatch: releasing ${NEXT}"
          else
            # One record per commit: subject line, then body (for BREAKING CHANGE
            # footers). Highest-priority prefix in the range wins. The range is
            # measured from LAST_TAG, not LAST: only a tag present in this
            # checkout is a usable revision. When a release is ahead of the tags
            # the range over-reports, which is harmless — it can only pick a
            # bump type, and BASE above already accounts for the release.
            LOG="$(git log ${LAST_TAG:+$LAST_TAG..HEAD} --pretty=format:'%s%n%b')"

            if grep -qiE '^[[:space:]]*([a-z]+(\([^)]*\))?!:|major(\([^)]*\))?:)|BREAKING[ -]CHANGE' <<<"$LOG"; then
              BUMP="major"
            elif grep -qiE '^[[:space:]]*feat(\([^)]*\))?:' <<<"$LOG"; then
              BUMP="minor"
            elif grep -qiE '^[[:space:]]*fix(\([^)]*\))?:' <<<"$LOG"; then
              BUMP="patch"
            else
              echo "No fix/feat/breaking commits since ${LAST_TAG:-the start}; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            IFS=. read -r MAJOR MINOR PATCH <<<"$BASE"
            case "$BUMP" in
              major) NEXT="$((MAJOR + 1)).0.0" ;;
              minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
            echo "${BUMP} bump: ${BASE} -> ${NEXT}"
          fi

          # Both halves matter. A stale tag blocks the number even with no
          # release behind it; a live release must block it too, because
          # softprops/action-gh-release *updates* an existing release rather
          # than failing — it would hang new assets off the old tag, leaving the
          # tag pointing at one commit and the binaries built from another.
          if git rev-parse -q --verify "refs/tags/v${NEXT}" >/dev/null; then
            echo "::error::tag v${NEXT} already exists"
            exit 1
          fi

          if gh release view "v${NEXT}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::release v${NEXT} is already published"
            exit 1
          fi

          {
            echo "release=true"
            echo "version=${NEXT}"
          } >> "$GITHUB_OUTPUT"
          echo "### Releasing v${NEXT}" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Bundles ───────────────────────────────────────────────────────────────
  bundle:
    name: Bundle · ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            cli_suffix: aarch64-apple-darwin
          # macos-15-intel, not the retired macos-13: GitHub removed the
          # macos-13 label, and a job asking for it waits forever for a runner.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            cli_suffix: x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cli_suffix: x86_64-linux-gnu

    env:
      MIX_ENV: prod
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      # Pin the exact commit rather than letting the ref float: `release` tags
      # this same SHA, so the tag and the bundles always describe one commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # ── Version stamp ────────────────────────────────────────────────────────
      # Before anything reads these files:
      #   * tauri.conf.json names the bundle (Codrift_<version>_<arch>.dmg), and
      #     that name is exactly what the Homebrew cask URL points at — stale
      #     here means a 404 on `brew install`.
      #   * mix.exs sets the OTP app vsn, which is what Codrift.Updater reports
      #     as the running version. Stale here means every installed build sees
      #     itself as older than the release forever and re-installs on every
      #     check.
      # perl (not sed -i) because this step runs on both macOS and Linux runners.
      - name: Stamp version into mix.exs and tauri.conf.json
        shell: bash
        run: |
          set -euo pipefail
          perl -pi -e 's/^(\s*version: )"[^"]*"/$1"$ENV{VERSION}"/' mix.exs
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.tmp
          mv tauri.tmp src-tauri/tauri.conf.json
          echo "mix.exs: $(grep -m1 'version:' mix.exs)"
          echo "tauri.conf.json: $(jq -r .version src-tauri/tauri.conf.json)"

      # ── Toolchains ───────────────────────────────────────────────────────────
      # OTP 27: ex_tauri wraps the Elixir sidecar with Burrito, which does not yet
      # support OTP 28. The exact patch is pinned — see the note on OTP_VERSION.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: assets/pnpm-lock.yaml

      # Burrito wraps the sidecar with Zig; it pins an exact version and also
      # needs `xz` on PATH.
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      # Linux Tauri builds need GTK/WebKit system libraries; xz for Burrito.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf xz-utils

      # ── Dependencies ─────────────────────────────────────────────────────────
      - name: Elixir deps
        run: mix deps.get --only prod

      - name: Frontend deps + build
        working-directory: assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Cache Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: _build/_tauri
          key: ${{ runner.os }}-${{ matrix.target }}-tauri-cli-v2

      - name: Install Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked --root _build/_tauri

      # ── Build ────────────────────────────────────────────────────────────────
      # `mix ex_tauri.build` assembles the :desktop release, Burrito-wraps it as
      # the Tauri sidecar (burrito_out/desktop-<triple>), and bundles the app.
      # BURRITO_TARGET limits Burrito to the runner's native triple so we never
      # attempt a cross-OS BEAM build.
      - name: Build Tauri bundle
        env:
          CARGO_PROFILE_RELEASE_LTO: true
          BURRITO_TARGET: ${{ matrix.target }}
        run: mix ex_tauri.build --ci --target ${{ matrix.target }}

      # The `codrift` release is the headless CLI (mcp / initiative / session /
      # memory / integration / update). Shipped alongside the app so users can run
      # `codrift mcp install` and scripting commands.
      - name: Build CLI release
        run: mix release codrift --overwrite

      # ── Publish ──────────────────────────────────────────────────────────────
      # Everything that ships lands in dist/ under its final name, then every
      # file there gets a sibling `.sha256` — install.sh and Codrift.Updater
      # fetch `<asset-url>.sha256` and refuse to install on a mismatch.
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec mv {} dist/ \;
          mv _build/prod/codrift-*.tar.gz \
             "dist/codrift-cli-${VERSION}-${{ matrix.cli_suffix }}.tar.gz"
          # Hash from inside dist/ so each `.sha256` names a bare file and stays
          # usable with `shasum -c`. The glob is expanded once, so the checksums
          # being written don't get checksummed themselves.
          cd dist && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -l

      # Hand off to the `release` job rather than publishing here — see the note
      # at the top of this file about partial releases.
      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # ── 3. Publish ───────────────────────────────────────────────────────────────
  # Reached only when every bundle leg succeeded, so the tag and the release are
  # created once, complete. No tag exists yet (this runs on a branch push), so
  # the action creates `v<version>` and the Release together.
  release:
    name: Publish release
    needs: [version, bundle]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download every bundle
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: List assets
        run: ls -l dist

      # The bundle job stamps the version into mix.exs and tauri.conf.json, and
      # every asset is named from it. If a stamp silently failed — or a cached
      # build served an artifact from an earlier version — the names say so, and
      # publishing it would tag v<new> over binaries that report v<old>. Fail
      # here instead of shipping the mismatch.
      - name: Assert every asset carries the version being tagged
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          for f in dist/*; do
            case "$(basename "$f")" in
              *"${VERSION}"*) ;;
              *) echo "::error::$(basename "$f") does not carry version ${VERSION}"; bad=1 ;;
            esac
          done
          [ "$bad" -eq 0 ]

      # The version job checked this an hour ago, before the bundles built. Re-
      # check immediately before publishing: if v<version> appeared meanwhile,
      # the action below would quietly update that release instead of creating
      # one, and its tag would keep pointing at the older commit.
      - name: Assert the release does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::release v${VERSION} already exists; refusing to overwrite it"
            exit 1
          fi
          echo "v${VERSION} is unpublished; safe to create."

      # target_commitish is explicit: the action otherwise tags the default
      # branch's *current* HEAD, and main can move while the bundles build (the
      # previous run's cask bump alone does it). The tag would then name a
      # commit that was never built, and the next run's `git log $LAST..HEAD`
      # range would skip every commit the tag jumped over — so their feat:/fix:
      # prefixes never trigger a release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true

  # ── 4. Homebrew cask ─────────────────────────────────────────────────────────
  # This repo doubles as its own Homebrew tap (Casks/codrift.rb). Once both macOS
  # DMGs are published, rewrite the cask's version + per-arch checksums and push
  # to main so `brew upgrade` sees the new version immediately.
  #
  # One file, because the cask is the whole macOS package: its `binary` stanza
  # symlinks `codrift` into the app bundle, whose sidecar is a complete release
  # of the same code. There used to be a `codrift-cli` formula bumped alongside
  # it, which made brew download that release a second time.
  #
  # NOTE: this pushes a commit to `main`. If main ever becomes protected against
  # direct pushes, swap the "Commit and push" step for a `gh pr create`.
  cask:
    name: Bump Homebrew cask
    needs: [version, release]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The DMG names are read back off the release rather than assumed. Tauri
      # decides the architecture segment (`aarch64` is stable, but the Intel one
      # is `x64` or `x86_64` depending on version), and guessing it wrong here
      # would write a cask whose URL 404s. `aarch64` identifies the arm image;
      # whatever other .dmg exists is the Intel one.
      - name: Resolve published DMGs
        id: dmgs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t DMGS < <(
            gh release view "v${VERSION}" --json assets \
              --jq '.assets[].name | select(endswith(".dmg"))'
          )

          ARM_DMG=""; INTEL_DMG=""
          for d in "${DMGS[@]:-}"; do
            case "$d" in
              *aarch64*|*arm64*) ARM_DMG="$d" ;;
              *)                 INTEL_DMG="$d" ;;
            esac
          done

          if [ -z "$ARM_DMG" ] || [ -z "$INTEL_DMG" ]; then
            echo "::error::v${VERSION} must carry one arm and one intel .dmg; found: ${DMGS[*]:-none}"
            exit 1
          fi
          echo "arm=${ARM_DMG}  intel=${INTEL_DMG}"

          # Pull only the two checksum files the bundle job published beside the
          # images — a few bytes each, instead of ~200 MB of disk image.
          gh release download "v${VERSION}" --dir sums \
            --pattern "${ARM_DMG}.sha256" --pattern "${INTEL_DMG}.sha256"

          {
            echo "arm_dmg=${ARM_DMG}"
            echo "intel_dmg=${INTEL_DMG}"
            echo "arm_sha=$(awk '{print $1}' "sums/${ARM_DMG}.sha256")"
            echo "intel_sha=$(awk '{print $1}' "sums/${INTEL_DMG}.sha256")"
          } >> "$GITHUB_OUTPUT"
          rm -rf sums

      - name: Rewrite cask version, checksums and URLs
        shell: bash
        env:
          ARM_DMG: ${{ steps.dmgs.outputs.arm_dmg }}
          INTEL_DMG: ${{ steps.dmgs.outputs.intel_dmg }}
          ARM_SHA: ${{ steps.dmgs.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.dmgs.outputs.intel_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re

          version = os.environ["VERSION"]
          path = "Casks/codrift.rb"
          src = open(path).read()

          def arch_of(dmg):
              prefix, suffix = f"Codrift_{version}_", ".dmg"
              if not (dmg.startswith(prefix) and dmg.endswith(suffix)):
                  raise SystemExit(f"unexpected DMG name: {dmg}")
              return dmg[len(prefix):-len(suffix)]

          # on_arm precedes on_intel in the cask, so replacing each pair of
          # matches in file order maps arm -> intel.
          archs = iter([arch_of(os.environ["ARM_DMG"]), arch_of(os.environ["INTEL_DMG"])])
          shas = iter([os.environ["ARM_SHA"], os.environ["INTEL_SHA"]])

          src = re.sub(r'version "[^"]*"', f'version "{version}"', src, count=1)
          src = re.sub(r'sha256 "[^"]*"', lambda _: f'sha256 "{next(shas)}"', src, count=2)
          src, n = re.subn(
              r'(Codrift_#\{version\}_)[^.]+(\.dmg)',
              lambda m: f"{m.group(1)}{next(archs)}{m.group(2)}",
              src,
              count=2,
          )
          if n != 2:
              raise SystemExit(f"expected 2 DMG URLs in the cask, rewrote {n}")

          open(path, "w").write(src)
          PY
          git --no-pager diff -- Casks/codrift.rb || true

      # The step above trusts the .sha256 sidecars this same run published. This
      # one re-checks the rewritten cask by downloading both DMGs over the very
      # URL Homebrew will use, so a bad sidecar or a half-uploaded asset fails
      # here instead of in a user's `brew install`.
      - name: Verify the rewritten cask against the published DMGs
        run: bash .github/scripts/verify-cask.sh Casks/codrift.rb

      - name: Commit and push
        run: |
          if git diff --quiet Casks/codrift.rb; then
            echo "Tap already up to date; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/codrift.rb
          git commit -m "chore(cask): codrift ${VERSION} [skip ci]"
          # main may have advanced while the bundles built; rebase before pushing.
          git pull --rebase origin main
          git push origin main
